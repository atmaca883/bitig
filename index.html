<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.1drv.com https://*.livefilestore.com https://*.sharepoint.com https://my.microsoftpersonalcontent.com https://api.dropboxapi.com https://content.dropboxapi.com https://www.googleapis.com https://oauth2.googleapis.com https://api.pwnedpasswords.com">
  <title>Bitig</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitig">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="phone.css">
  <script src="theme.js"></script>
</head>
<body class="dock-float phone">

  <!-- Küçültülmüş şerit -->
  <section id="tab">
    <button id="tabExpand" class="tab-btn" title="Paneli aç (Ctrl+Shift+Space)">
      <span class="tab-arrow">⟨</span>
      <span class="tab-logo" data-brand="mark"></span>
    </button>
    <span id="tabBadge" class="tab-badge" hidden></span>
    <div class="tab-grip drag" title="Sürükle">
      <i></i><i></i><i></i>
    </div>
  </section>

  <!-- Açık panel -->
  <section id="panel">
    <header class="titlebar drag">
      <span class="brand"><span class="brand-mini" data-brand="mark"></span>Bitig</span>
      <div class="actions">
        <button id="btnSettings" class="icon-btn" title="Ayarlar ve yedek" hidden>⚙</button>
        <button id="btnBrowser" class="icon-btn" title="Tarayıcı bağlantısı" hidden>🌐</button>
        <button id="btnPin" class="icon-btn" title="Her zaman üstte">📌</button>
        <button id="btnLock" class="icon-btn" title="Kilitle" hidden>🔒</button>
        <button id="btnCollapse" class="icon-btn" title="Şerit hâline küçült">⟩</button>
        <button id="btnQuit" class="icon-btn danger" title="Kapat">✕</button>
      </div>
    </header>

    <!-- Kilit ekranı -->
    <div id="lockView" class="lock">
      <div class="lock-card">
        <div class="brand-hero">
          <div class="brand-logo" data-brand="mark"></div>
          <div class="brand-name">Bitig</div>
          <div class="brand-runes" data-brand="word" title="“bitig” Göktürk yazısıyla: yazıt, kitap"></div>
        </div>
        <h1 id="lockTitle">Tekrar hoş geldin</h1>
        <p id="lockHint" class="muted"></p>
        <form id="lockForm">
          <input id="pw1" type="password" placeholder="Ana şifre" autocomplete="off" autofocus>
          <input id="pw2" type="password" placeholder="Ana şifre (tekrar)" autocomplete="off" hidden>
          <button type="submit" class="primary" id="lockSubmit">Aç</button>
          <p id="lockError" class="error"></p>
        </form>
        <div class="lock-links">
          <button type="button" id="lnkForgot" class="link" hidden>Ana şifremi unuttum</button>
          <button type="button" id="lnkRestore" class="link">Yedekten geri yükle</button>
        </div>
        <div class="lock-foot">🔒 Uçtan uca şifreli · verilerin yalnızca senin cihazlarında açılır</div>
        <p id="lockWarn" class="muted small" hidden>
          Bu şifre hiçbir yere kaydedilmez. Unutursan kasayı sadece birazdan vereceğim <b>kurtarma anahtarı</b> ile açabilirsin.
        </p>
      </div>
    </div>

    <!-- PIN ile hızlı kilit -->
    <div id="pinView" class="lock" hidden>
      <div class="lock-card">
        <div class="brand-hero small">
          <div class="brand-logo" data-brand="mark"></div>
          <div class="brand-name">Bitig</div>
          <div class="brand-runes" data-brand="word" title="“bitig” Göktürk yazısıyla: yazıt, kitap"></div>
        </div>
        <h1>Kilitli</h1>
        <p class="muted">Devam etmek için PIN'ini gir.</p>
        <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
        <p id="pinError" class="error"></p>
        <div class="pin-pad" id="pinPad"></div>
        <div class="lock-links">
          <button type="button" id="lnkPinMaster" class="link">Ana şifreyle aç</button>
        </div>
      </div>
    </div>

    <!-- Ana görünüm -->
    <div id="mainView" hidden>
      <div class="toolbar">
        <div class="search">
          <span>🔍</span>
          <input id="search" type="search" placeholder="Her şeyde ara…  (Ctrl+K)">
        </div>
        <select id="projectFilter" title="Projeye göre süz"></select>
      </div>

      <nav class="tabs" id="tabs">
        <button data-view="today" class="active">Bugün</button>
        <button data-view="passwords">Şifreler</button>
        <button data-view="notes">Notlar</button>
        <button data-view="tasks">Görevler</button>
        <button data-view="projects">Projeler</button>
      </nav>

      <div id="banner" class="banner" hidden></div>
      <div id="prompts" class="prompts"></div>
      <div class="split" id="split">
        <div class="top-pane">
          <div id="content" class="content"></div>
          <button id="fab" class="fab" title="Yeni ekle">＋</button>
        </div>
        <div id="splitter" class="splitter" title="Sürükleyerek boyutlandır"><i></i></div>
        <section id="calendar" class="calendar"></section>
      </div>
    </div>

    <!-- Düzenleme sayfası -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-head">
        <button id="sheetBack" class="icon-btn" title="Geri">←</button>
        <h2 id="sheetTitle"></h2>
      </div>
      <form id="sheetForm" class="sheet-body"></form>
      <div class="sheet-foot">
        <button id="sheetDelete" class="ghost danger" type="button">Sil</button>
        <span class="spacer"></span>
        <button id="sheetCancel" class="ghost" type="button">Vazgeç</button>
        <button id="sheetSave" class="primary" type="button">Kaydet</button>
      </div>
    </div>

    <div id="dialog" class="dialog" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </section>

  <script src="i18n.js"></script>
  <script src="vendor/scrypt.js"></script>
  <script src="config.js"></script>
  <script src="crypto.js"></script>
  <script src="biometric.js"></script>
  <script src="store.js"></script>
  <script src="cloud-dropbox.js"></script>
  <script src="cloud-onedrive.js"></script>
  <script src="drive.js"></script>
  <script src="kasa-core.js"></script>
  <script src="importer.js"></script>
  <script src="strength.js"></script>
  <script src="sync-merge.js"></script>
  <script src="backend.js"></script>
  <script src="brand.js"></script>
  <script src="util.js"></script>
  <script src="state.js"></script>
  <script src="dialogs.js"></script>
  <script src="rows.js"></script>
  <script src="views.js"></script>
  <script src="calendar.js"></script>
  <script src="trash.js"></script>
  <script src="editor.js"></script>
  <script src="creds.js"></script>
  <script src="lock.js"></script>
  <script src="settings.js"></script>
  <script src="phone-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
